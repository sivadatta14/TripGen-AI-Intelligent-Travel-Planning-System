<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Choose your travel preferences to get the perfect AI-generated itinerary.">

    <title>Preferences | AI Travel Planner</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await checkAuth();
            if (!user || !user.logged_in) {
                window.location.href = "signin.html";
            }
        });
    </script>

                <!-- NIGHTLIFE -->

                    <input
                        type="checkbox"

            </div>


            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <a href="trip-details.html" class="primary-btn" style="background: transparent; color: #5ddcff; border: 2px solid #5ddcff; text-align: center; flex: 1;">
                    ← Back
                </a>
                
                <button
                    type="submit"
                    class="primary-btn" style="flex: 2;">
    
                    ✨ GENERATE MY TRIP
    
                </button>
            </div>

        </form>

    </div>

</div>


<script>

    // Pre-check checkboxes from sessionStorage if available
    document.addEventListener("DOMContentLoaded", function() {
        const savedPreferences = sessionStorage.getItem("preferences");
        if (savedPreferences) {
            try {
                const prefsArray = JSON.parse(savedPreferences);
                const checkboxes = document.querySelectorAll('input[name="preferences"]');
                checkboxes.forEach(function(cb) {
                    if (prefsArray.includes(cb.value)) {
                        cb.checked = true;
                    }
                });
            } catch (e) {
                console.error("Failed to parse preferences from sessionStorage");
            }
        }
    });

    document.getElementById("preferences-form").addEventListener("submit", function (e) {

        e.preventDefault();

        // Collect selected preferences
        const checked = document.querySelectorAll('input[name="preferences"]:checked');
        const preferences = Array.from(checked).map(function (cb) { return cb.value; });

        sessionStorage.setItem("preferences", JSON.stringify(preferences));

        // Navigate to loading page
        window.location.href = "loading.html";

    });

</script>

</body>

</html>
